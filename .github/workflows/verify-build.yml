name: Verify build

# Builds the app exactly the way a release does — same runner, same SDK —
# and uploads the bundle as an artifact. Publishes nothing.
#
# It exists because v0.8.0 shipped a panel three times its intended height
# that could not be reproduced on the development machine: the runner
# builds against an older macOS SDK whose SwiftUI sizes the view tree
# differently, so every local screenshot was of a binary without the
# defect. Anything about window geometry has to be checked on a bundle
# built here, and until now the only way to get one was to publish a
# release.
on:
  workflow_dispatch:
  push:
    branches:
      - 'verify/**'

jobs:
  build:
    runs-on: macos-14   # Same runner as release.yml — the SDK is the point
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: scripts/release/build.sh

      - name: Report the SDK it was built against
        run: |
          otool -l build/release/Clyde.app/Contents/MacOS/Clyde \
            | grep -A4 LC_BUILD_VERSION | grep -E 'minos|sdk' | head -4

      - name: Measure the panel on this SDK
        run: |
          swift test --filter ExpandedPanel 2>&1 | tee /tmp/panel-test.log | tail -40
          echo "--- probe ---"
          grep PANEL-PROBE /tmp/panel-test.log || echo "no probe output"

      - name: Measure the built bundle's windows
        run: |
          # The panel exists from launch at alpha 0, so nothing has to be
          # opened — CGWindowList reads it directly and needs no
          # permission. A runner with no window server reports no windows
          # at all, which is a different answer from a wrong size: say so
          # and move on rather than failing a build over the environment.
          open build/release/Clyde.app
          sleep 12
          if ! geometry=$(swift scripts/dev/window-geometry.swift Clyde); then
            echo "SKIPPED: no Clyde windows visible on this runner (no window server)"
            exit 0
          fi
          echo "$geometry"
          panel=$(echo "$geometry" | awk '{print $1}' | grep '^400x' | head -1)
          widget=$(echo "$geometry" | awk '{print $1}' | grep '^130x' | head -1)
          fail=0
          [ "$panel" = "400x420" ] || { echo "::error::expanded panel is ${panel:-missing}, expected 400x420"; fail=1; }
          [ "$widget" = "130x46" ] || { echo "::error::widget is ${widget:-missing}, expected 130x46"; fail=1; }
          exit $fail

      - name: Package
        run: ditto -c -k --keepParent build/release/Clyde.app Clyde-app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Clyde-app
          path: Clyde-app.zip
          retention-days: 3
